name: PR Checks

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: site
        run: bun install --frozen-lockfile

      - name: Lint
        working-directory: site
        run: bun run lint

      - name: Build
        working-directory: site
        run: bun run build
